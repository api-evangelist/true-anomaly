name: True Anomaly
description: 'True Anomaly is a defense-technology company building spacecraft, software,
  and payloads for space superiority. Its products include Jackal, a multirole space-superiority
  platform positioned as a tactical fighter-interceptor for contested orbital environments,
  and Mosaic, an autonomy software platform that transforms commander intent into autonomous
  action. The company serves U.S. government and allied defense customers from facilities
  in Centennial and Colorado Springs, Colorado; Long Beach, California; and Washington,
  DC. True Anomaly publishes no public API, developer portal, or SDK; its only machine-readable
  public surface is an RFC 9116 security.txt vulnerability-disclosure contact.'
